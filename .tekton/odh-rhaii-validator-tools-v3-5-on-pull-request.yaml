apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/rhaii-cluster-validation?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && target_branch == "rhoai-3.5"
      && ( files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-rhaii-validator-tools-v3-5-on-pull-request.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-5
    appstudio.openshift.io/component: odh-rhaii-validator-tools-v3-5
    pipelines.appstudio.openshift.io/type: build
  name: odh-rhaii-validator-tools-v3-5-on-pull-request
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h
    tasks: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-rhaii-validator-tools-rhel9:on-pr-{{pull_request_number}}
  - name: image-expires-after
    value: 30d
  - name: rhoai-version
    value: "3.5.3"
  - name: dockerfile
    value: Dockerfile.konflux.validator.tools
  - name: path-context
    value: .
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: |
      [
        {"type": "rpm", "path": "tools"},
        {"type": "rpm", "path": "tools/builder"}
      ]
  - name: build-source-image
    value: "true"
  - name: build-image-index
    value: "true"
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  - name: disable-slack-notifications
    value: "true"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-rhaii-validator-tools-v3-5
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  taskRunSpecs:
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
status: {}
